<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#191521"/>
      <stop offset="70%" stop-color="#100d16"/>
      <stop offset="100%" stop-color="#0b0910"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EB088A"/>
      <stop offset="55%" stop-color="#8A25C9"/>
      <stop offset="100%" stop-color="#313CFF"/>
    </linearGradient>
    <linearGradient id="ember" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- the prompt: a vector chevron -->
  <path d="M 314 318 L 554 512 L 314 706" stroke="url(#brand)" stroke-width="110"
        stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- the cursor: warm, mid-blink -->
  <rect x="654" y="263" width="116" height="498" rx="34" fill="url(#ember)" filter="url(#glow)"/>
</svg>
