display_information:
  name: aieng-bot
  description: Vector Institute AI engineering agent — answers questions and does work in channels, threads, and DMs
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: aieng-bot
    always_online: true
  slash_commands:
    - command: /aieng-bot
      description: Interact with aieng-bot (try "version" to check the running build)
      usage_hint: version
      should_escape: false
oauth_config:
  scopes:
    bot:
      # Respond when @mentioned
      - app_mentions:read
      - chat:write
      # Slash commands
      - commands
      # Background listening in channels the bot is invited to
      # (this powers per-thread context; the bot only sees channels
      # it is explicitly added to)
      - channels:history
      - groups:history
      # Direct messages and group DMs
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      # Resolve channel/user names for context
      - channels:read
      - groups:read
      - users:read
      # Nice-to-haves: ack reactions, read shared files
      - reactions:write
      - files:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
